<script>
  (function () {
    var saved = localStorage.getItem("tw-theme");
    if (saved === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<button id="tw-theme-toggle" aria-label="라이트/다크 모드 전환" title="라이트/다크 모드 전환">
  <span class="tw-icon-light">☀️</span>
  <span class="tw-icon-dark">🌙</span>
</button>

<script>
  (function () {
    document.addEventListener("DOMContentLoaded", function () {
      var btn = document.getElementById("tw-theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var html = document.documentElement;
        var isLight = html.getAttribute("data-theme") === "light";
        if (isLight) {
          html.removeAttribute("data-theme");
          localStorage.setItem("tw-theme", "dark");
        } else {
          html.setAttribute("data-theme", "light");
          localStorage.setItem("tw-theme", "light");
        }
      });
    });
  })();
</script>
