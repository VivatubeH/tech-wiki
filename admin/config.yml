backend:
  name: github
  repo: VivatubeH/tech-wiki
  branch: main
  base_url: https://tech-wiki-cms-auth.dltkdgus2008.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/tech-wiki/assets/uploads"

collections:
  - name: "network"
    label: "01. 네트워크"
    folder: "01-network"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "정렬 순서", name: "nav_order", widget: "number", default: 2 }
      - { label: "부모", name: "parent", widget: "hidden", default: "01. 네트워크" }
      - { label: "본문", name: "body", widget: "markdown" }

