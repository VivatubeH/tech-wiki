<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>Tech Wiki 글쓰기</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerEditorComponent({
      id: "colortext",
      label: "글자색",
      fields: [
        {
          name: "color",
          label: "색상",
          widget: "select",
          options: [
            { label: "빨강", value: "#e63946" },
            { label: "주황", value: "#f4a261" },
            { label: "초록", value: "#2a9d8f" },
            { label: "파랑", value: "#457b9d" },
            { label: "보라", value: "#8338ec" },
            { label: "회색", value: "#6c757d" }
          ]
        },
        { name: "text", label: "텍스트", widget: "string" }
      ],
      pattern: /^<span style="color:\s*([^;"]+);?">(.*)<\/span>$/,
      fromBlock: function (match) {
        return { color: match[1], text: match[2] };
      },
      toBlock: function (obj) {
        return '<span style="color: ' + obj.color + ';">' + obj.text + '</span>';
      },
      toPreview: function (obj) {
        return '<span style="color: ' + obj.color + ';">' + obj.text + '</span>';
      }
    });
  </script>
</body>
</html>
